services:
  sari:
    build:
      context: .
      dockerfile: Dockerfile
    image: sari-app:latest
    container_name: sari-app
    restart: unless-stopped

    # Loopback only — nginx on the host is the sole public entry point.
    ports:
      - "127.0.0.1:3001:3000"

    env_file:
      - .env

    environment:
      PORT: "3000"
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      # Public origin, used for absolute URLs / redirects behind the proxy.
      NEXT_PUBLIC_SITE_URL: https://sari.conversery.com

    volumes:
      # Persist the Next.js incremental cache across restarts.
      - sari_cache:/app/.next/cache

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sari_cache:
    driver: local
